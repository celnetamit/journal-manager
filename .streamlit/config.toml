[server]
headless = true
port = 8501
address = "0.0.0.0"
# CORS + XSRF are both kept enabled for safety. If you front the app with
# a reverse proxy on the same origin, you can disable CORS instead.
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 50
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#FF4B4B"

[client]
# Cached toolcalls, etc. No secrets here — use env vars.
showErrorDetails = false
toolbarMode = "minimal"

[server]
headless = true
port = 8501
address = "0.0.0.0"
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 50
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#FF4B4B"

[client]
# Cached toolcalls, etc. No secrets here — use env vars.
showErrorDetails = false
toolbarMode = "minimal"
